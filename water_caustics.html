<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Procedural Water Caustics</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: smooth;
    }
    .overlay {
      position: fixed;
      left: 10px;
      bottom: 10px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.4);
      color: #eee;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      border-radius: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body>
<canvas id="caustics"></canvas>
<div class="overlay">
  Procedural water caustics – noise + distortion + thresholded highlights
</div>
<script>
  const canvas = document.getElementById("caustics");
  const ctx = canvas.getContext("2d");

  // Internal resolution (lower for speed, then upscaled)
  let internalWidth = 360;
  let internalHeight = 202;

  function resize() {
    const ratio = window.devicePixelRatio || 1;
    canvas.width = internalWidth * ratio;
    canvas.height = internalHeight * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // --- Utility functions ---
  function fract(x) { return x - Math.floor(x); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // 2D hash-based value noise (no external libraries)
  function hash2(x, y) {
    // Cheap hash adapted from IQ-style GLSL noise
    let n = x * 127.1 + y * 311.7;
    return fract(Math.sin(n) * 43758.5453123);
  }

  function valueNoise(x, y) {
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    const fx = x - ix;
    const fy = y - iy;

    const a = hash2(ix,     iy);
    const b = hash2(ix + 1, iy);
    const c = hash2(ix,     iy + 1);
    const d = hash2(ix + 1, iy + 1);

    // Smooth interpolation (Hermite curve)
    const u = fx * fx * (3 - 2 * fx);
    const v = fy * fy * (3 - 2 * fy);

    const ab = lerp(a, b, u);
    const cd = lerp(c, d, u);
    return lerp(ab, cd, v);
  }

  // Fractal Brownian Motion (fbm) — multiple octaves of noise
  function fbm(x, y, octaves = 4) {
    let value = 0;
    let amplitude = 0.5;
    let frequency = 1.0;
    for (let i = 0; i < octaves; i++) {
      value += amplitude * valueNoise(x * frequency, y * frequency);
      frequency *= 2.0;
      amplitude *= 0.5;
    }
    return value;
  }

  let lastTime = performance.now();

  function render(now) {
    requestAnimationFrame(render);

    const dt = (now - lastTime) * 0.001;
    lastTime = now;

    const time = now * 0.00025; // global time

    const img = ctx.createImageData(internalWidth, internalHeight);
    const data = img.data;

    // Parameters you can tweak
    const scale = 2.2;          // spatial scaling of the pattern
    const distortionStrength = 1.8;
    const baseBrightness = 0.05;
    const intensityScale = 4.5; // contrast of highlights
    const threshold = 0.45;     // where highlights “turn on”

    let idx = 0;
    for (let y = 0; y < internalHeight; y++) {
      for (let x = 0; x < internalWidth; x++) {
        // Normalize coords to [-1,1]
        const nx = (x / internalWidth) * 2 - 1;
        const ny = (y / internalHeight) * 2 - 1;

        // Base coordinates for noise
        let u = nx * scale;
        let v = ny * scale;

        // Flow / turbulence: distort coords with fbm
        const warp1 = fbm(u + time * 0.7, v - time * 0.4 + 10.0);
        const warp2 = fbm(u - time * 0.5 + 20.0, v + time * 0.6);

        u += (warp1 - 0.5) * distortionStrength;
        v += (warp2 - 0.5) * distortionStrength;

        // Main noise field
        const n = fbm(u + time * 1.1, v - time * 1.3);

        // Approximate gradient magnitude (edge strength) to fake caustics
        const eps = 0.03;
        const nx1 = fbm(u + eps, v);
        const nx2 = fbm(u - eps, v);
        const ny1 = fbm(u, v + eps);
        const ny2 = fbm(u, v - eps);
        const gx = nx1 - nx2;
        const gy = ny1 - ny2;
        const gradMag = Math.sqrt(gx * gx + gy * gy);

        // Combine noise and gradient for “hot spots”
        let intensity = n + gradMag * 2.0;

        // Threshold & steepen curve for bright blobs
        intensity = Math.max(0, intensity - threshold) * intensityScale;
        intensity = Math.pow(intensity, 2.2); // pseudo-bloom / glow

        // Base color: soft green water + warm highlights
        const waterR = 0.7, waterG = 0.9, waterB = 0.8;
        const highlightR = 1.4, highlightG = 1.25, highlightB = 1.0;

        const r = (waterR * baseBrightness + highlightR * intensity) * 255;
        const g = (waterG * baseBrightness + highlightG * intensity) * 255;
        const b = (waterB * baseBrightness + highlightB * intensity) * 255;

        data[idx++] = Math.min(255, r);
        data[idx++] = Math.min(255, g);
        data[idx++] = Math.min(255, b);
        data[idx++] = 255; // alpha
      }
    }

    ctx.putImageData(img, 0, 0);

    // Upscale to fill viewport (the CSS width/height already do that visually)
    // Nothing else needed here.
  }

  requestAnimationFrame(render);
</script>
</body>
</html>
